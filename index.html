
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>EWO | Private Space</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: white;
    font-family: 'Montserrat', sans-serif;
    user-select: none;
}

input {
    user-select: text;
}

.page {
    display: none;
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow-y: auto;
    background: #000;
}

.page.active {
    display: block;
}

.scene {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.65)),
        url("file_000000003d188212a637e33ebda69a68.webp")
        center / cover no-repeat;
    z-index: 0;
}

/* LOGIN PAGE */
.content {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.logo {
    font-size: 43px;
    font-weight: 800;
    letter-spacing: 8px;
    color: #e4bd59;
    text-shadow: 0 0 20px rgba(228,189,89,.35);
}

.subtitle {
    color: #aaa;
    font-size: 10px;
    letter-spacing: 4px;
    margin-top: 10px;
}

.login-box {
    width: 100%;
    max-width: 350px;
    text-align: center;
}

.login-title {
    font-size: 13px;
    color: #d6ad45;
    letter-spacing: 3px;
    margin-bottom: 30px;
}

.password-wrap {
    display: flex;
    align-items: center;
    width: 100%;
    border: 1px solid #a88432;
    border-radius: 10px;
    background: rgba(0,0,0,.65);
    overflow: hidden;
}

.password-wrap input {
    flex: 1;
    min-width: 0;
    padding: 16px;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 3px;
}

.password-wrap input::placeholder {
    color: #777;
    letter-spacing: 2px;
    font-size: 11px;
}

.eye-btn {
    width: 52px;
    height: 50px;
    border: none;
    background: transparent;
    color: #e4bd59;
    font-size: 20px;
}

.main-btn {
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: 1px solid #d6ad45;
    border-radius: 10px;
    background: linear-gradient(135deg, #8b681f, #d6ad45, #8b681f);
    color: #080808;
    font-family: inherit;
    font-weight: 800;
    font-size: 12px;
    letter-spacing: 3px;
}

.error {
    min-height: 18px;
    color: #ff5555;
    font-size: 10px;
    margin-top: 13px;
}

.footer {
    position: absolute;
    bottom: 22px;
    left: 0;
    width: 100%;
    text-align: center;
    color: #888;
    font-size: 9px;
    letter-spacing: 3px;
}

/* HOME PAGE */
.home-content {
    min-height: 100%;
    position: relative;
    z-index: 1;
}

.logout {
    position: absolute;
    top: 25px;
    right: 20px;
    padding: 10px 17px;
    color: #ff5555;
    background: rgba(0,0,0,.5);
    border: 1px solid #a52c2c;
    border-radius: 7px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 2px;
}

/* NOTIFICATION */
.notification-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(0,0,0,.88);
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.notification-overlay.show {
    display: flex;
}

.notification-box {
    width: 100%;
    max-width: 360px;
    padding: 35px 25px;
    text-align: center;
    border: 1px solid #b68d35;
    border-radius: 17px;
    background: linear-gradient(145deg, #17130a, #050505);
    box-shadow: 0 0 35px rgba(214,173,69,.15);
}

.notification-box h2 {
    color: #e4bd59;
    font-size: 17px;
    letter-spacing: 3px;
    margin-bottom: 25px;
}

.message {
    color: #ddd;
    font-size: 14px;
    line-height: 2;
}

.close-btn {
    margin-top: 30px;
    padding: 13px 35px;
    background: transparent;
    border: 1px solid #d6ad45;
    color: #e4bd59;
    border-radius: 8px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 3px;
}

/* HEADER */
.page-header {
    width: 100%;
    padding: 25px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(214,173,69,.5);
}

.header-logo {
    color: #e4bd59;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 5px;
}

.back-btn {
    background: transparent;
    border: 1px solid #a52c2c;
    color: #ff5555;
    padding: 9px 17px;
    border-radius: 7px;
    font-family: inherit;
    font-size: 10px;
    letter-spacing: 2px;
}

/* MAIN MENU */
.main-menu {
    min-height: calc(100% - 80px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.welcome-title {
    color: #e4bd59;
    font-size: 25px;
    font-weight: 800;
    letter-spacing: 4px;
    text-align: center;
}

.welcome-subtitle {
    margin-top: 13px;
    font-size: 10px;
    color: #999;
    letter-spacing: 3px;
    text-align: center;
}

.menu-buttons {
    width: 100%;
    max-width: 330px;
    margin-top: 55px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.menu-btn {
    padding: 20px;
    background: linear-gradient(145deg, #17130a, #050505);
    border: 1px solid #a88432;
    border-radius: 12px;
    color: #e4bd59;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 4px;
}

/* SECTION TITLE */
.section-title {
    text-align: center;
    color: #e4bd59;
    font-size: 18px;
    letter-spacing: 4px;
    margin: 30px 0;
}

/* NOTES LIST */
.notes-list {
    padding: 0 20px 35px;
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.note-btn {
    width: 100%;
    padding: 17px;
    text-align: left;
    color: #e4bd59;
    background: #0b0b0b;
    border: 1px solid #6f5523;
    border-radius: 9px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 2px;
}

/* NOTE VIEWER PAGE */
.note-viewer-content {
    padding: 25px 20px 40px;
}

.note-page-title {
    color: #e4bd59;
    font-size: 20px;
    letter-spacing: 4px;
    text-align: center;
    margin: 15px 0 30px;
}

.note-paper {
    min-height: 300px;
    padding: 23px;
    border: 1px solid #a88432;
    border-radius: 12px;
    background: linear-gradient(145deg, #100e09, #050505);
    box-shadow: 0 0 20px rgba(214,173,69,.06);
}

.note-text {
    color: #ddd;
    font-size: 13px;
    line-height: 2.1;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.note-status {
    color: #999;
    font-size: 11px;
    margin-top: 15px;
    text-align: center;
}

/* IMAGE GALLERY */
.gallery {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 13px;
    padding: 0 15px 35px;
}

.image-card {
    min-height: 145px;
    border: 1px solid #8b681f;
    border-radius: 10px;
    background: #111;
    overflow: hidden;
}

.image-card img {
    display: block;
    width: 100%;
    height: 145px;
    object-fit: cover;
}

.image-label {
    padding: 10px 5px;
    color: #e4bd59;
    text-align: center;
    font-size: 10px;
    letter-spacing: 2px;
}

/* IMAGE PREVIEW */
.preview {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 30;
    background: rgba(0,0,0,.96);
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.preview.show {
    display: flex;
}

.preview img {
    max-width: 100%;
    max-height: 82vh;
    object-fit: contain;
}

.preview-close {
    position: absolute;
    top: 25px;
    right: 20px;
    color: #ff5555;
    background: #111;
    border: 1px solid #a52c2c;
    border-radius: 7px;
    padding: 10px 16px;
    font-size: 12px;
}

@media(max-width: 360px) {
    .logo { font-size: 36px; }
    .welcome-title { font-size: 21px; }
    .image-card img { height: 125px; }
    .image-card { min-height: 125px; }
}
</style>
</head>

<body>

<!-- PAGE 1: LOGIN -->
<section class="page active" id="loginPage">
    <div class="scene"></div>

    <div class="content">
        <div class="login-box">
            <div class="logo">EWO</div>
            <div class="subtitle">PRIVATE SPACE</div>

            <div style="height:55px"></div>

            <div class="login-title">ENTER YOUR PASSWORD</div>

            <div class="password-wrap">
                <input
                    type="password"
                    id="passwordInput"
                    placeholder="ENTER PASSWORD"
                    autocomplete="off"
                    inputmode="numeric"
                    oninput="checkPassword()"
                >
                <button class="eye-btn" type="button"
                    onclick="togglePassword()" id="eyeButton">👁</button>
            </div>

            <button class="main-btn" onclick="login()">UNLOCK</button>
            <div class="error" id="errorMessage"></div>
        </div>
    </div>

    <div class="footer">DANU EWONZ • 2026</div>
</section>


<!-- PAGE 2: HOME -->
<section class="page" id="homePage">
    <div class="scene"></div>
    <div class="home-content">
        <button class="logout" onclick="logout()">LOG OUT</button>
    </div>
</section>


<!-- PAGE 3: MAIN MENU -->
<section class="page" id="mainPage">
    <div class="page-header">
        <div class="header-logo">EWO.</div>
        <button class="back-btn" onclick="openPage('homePage')">BACK</button>
    </div>

    <div class="main-menu">
        <div class="welcome-title">WELCOME TO EWO</div>
        <div class="welcome-subtitle">YOUR OWN PRIVATE WORLD</div>

        <div class="menu-buttons">
            <button class="menu-btn" onclick="openPage('notesPage')">
                NOTES
            </button>

            <button class="menu-btn" onclick="openPage('imagesPage')">
                ♡ IMAGE
            </button>
        </div>
    </div>
</section>


<!-- PAGE 4: NOTES LIST -->
<section class="page" id="notesPage">
    <div class="page-header">
        <div class="header-logo">EWO.</div>
        <button class="back-btn" onclick="openPage('mainPage')">BACK</button>
    </div>

    <h2 class="section-title">PRIVATE NOTES</h2>

    <div class="notes-list" id="notesList"></div>
</section>


<!-- PAGE 5: NOTE VIEWER -->
<section class="page" id="noteViewerPage">
    <div class="page-header">
        <div class="header-logo">EWO.</div>
        <button class="back-btn" onclick="openPage('notesPage')">BACK</button>
    </div>

    <div class="note-viewer-content">
        <h2 class="note-page-title" id="noteHeading">NOTE</h2>

        <div class="note-paper">
            <div class="note-text" id="noteText"></div>
            <div class="note-status" id="noteStatus"></div>
        </div>
    </div>
</section>


<!-- PAGE 6: IMAGE GALLERY -->
<section class="page" id="imagesPage">
    <div class="page-header">
        <div class="header-logo">EWO.</div>
        <button class="back-btn" onclick="openPage('mainPage')">BACK</button>
    </div>

    <h2 class="section-title">IMAGE GALLERY</h2>
    <div class="gallery" id="imageGallery"></div>
</section>


<!-- NOTIFICATION -->
<div class="notification-overlay" id="notification">
    <div class="notification-box">
        <h2>♡ PRIVATE MESSAGE</h2>

        <div class="message">
            Even if I die, I will always love that heart with all mine.
            When I'm no longer around, please keep living happily. 🥀
        </div>

        <button class="close-btn" onclick="closeNotification()">
            CONTINUE
        </button>
    </div>
</div>


<!-- IMAGE PREVIEW -->
<div class="preview" id="imagePreview" onclick="closePreview()">
    <button class="preview-close" onclick="closePreview()">CLOSE ✕</button>
    <img id="previewImage" src="" alt="Private Image">
</div>


<script>

/* PAGE NAVIGATION */
function openPage(pageId) {
    document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
    });

    const target = document.getElementById(pageId);

    if (target) {
        target.classList.add('active');
        target.scrollTop = 0;
    }
}


/* PASSWORD SHOW / HIDE */
function togglePassword() {
    const input = document.getElementById('passwordInput');
    const eye = document.getElementById('eyeButton');

    if (input.type === 'password') {
        input.type = 'text';
        eye.textContent = '🙈';
    } else {
        input.type = 'password';
        eye.textContent = '👁';
    }

    input.focus();
}


/* AUTO LOGIN */
let loginStarted = false;

function checkPassword() {
    const input = document.getElementById('passwordInput');
    const error = document.getElementById('errorMessage');

    error.textContent = '';

    if (input.value === '19971128' && !loginStarted) {
        login();
    }
}


/* LOGIN */
function login() {
    const password = document.getElementById('passwordInput').value;
    const error = document.getElementById('errorMessage');

    if (password === '19971128' && !loginStarted) {
        loginStarted = true;

        openPage('homePage');
        document.getElementById('notification').classList.add('show');

    } else if (password !== '19971128') {
        error.textContent = 'Incorrect Password. Try Again.';
    }
}


/* NOTIFICATION */
function closeNotification() {
    document.getElementById('notification').classList.remove('show');
    openPage('mainPage');
}


/* LOG OUT */
function logout() {
    document.getElementById('notification').classList.remove('show');

    document.getElementById('passwordInput').value = '';
    document.getElementById('passwordInput').type = 'password';
    document.getElementById('eyeButton').textContent = '👁';
    document.getElementById('errorMessage').textContent = '';

    loginStarted = false;

    resetAll();
    openPage('loginPage');
}


/* NOTE 1 - 10 BUTTONS */
const notesList = document.getElementById('notesList');

for (let i = 1; i <= 10; i++) {
    const button = document.createElement('button');

    button.className = 'note-btn';
    button.textContent = 'NOTE ' + i;

    button.onclick = function() {
        loadNote(i);
    };

    notesList.appendChild(button);
}


/* LOAD ALL 10 NOTE FILES */
async function loadNote(number) {
    const heading = document.getElementById('noteHeading');
    const text = document.getElementById('noteText');
    const status = document.getElementById('noteStatus');

    heading.textContent = 'NOTE ' + number;
    text.textContent = 'Loading...';
    status.textContent = '';

    /* Open separate note page */
    openPage('noteViewerPage');

    try {
        const fileName = 'Note ' + number + '.txt';

        const response = await fetch(
            'NOTES/' +
            encodeURIComponent(fileName) +
            '?v=' + Date.now()
        );

        if (!response.ok) {
            throw new Error('File not found');
        }

        const content = await response.text();

        text.textContent = content || 'This note is empty.';

    } catch (error) {
        text.textContent = 'Unable to load Note ' + number + '.';

        status.textContent =
            'Please check NOTES/Note ' + number + '.txt in GitHub.';
    }
}


/* IMAGE GALLERY */
const gallery = document.getElementById('imageGallery');

for (let i = 1; i <= 10; i++) {
    const card = document.createElement('div');
    card.className = 'image-card';

    const img = document.createElement('img');
    img.src = 'IMAGES/Image ' + i + '.jpg';
    img.alt = 'Image ' + i;

    img.onerror = function() {
        card.style.display = 'none';
    };

    img.onclick = function() {
        openPreview(this.src);
    };

    const label = document.createElement('div');
    label.className = 'image-label';
    label.textContent = 'IMAGE ' + i;

    card.appendChild(img);
    card.appendChild(label);
    gallery.appendChild(card);
}


/* IMAGE PREVIEW */
function openPreview(src) {
    document.getElementById('previewImage').src = src;
    document.getElementById('imagePreview').classList.add('show');
}

function closePreview() {
    document.getElementById('imagePreview').classList.remove('show');
    document.getElementById('previewImage').src = '';
}


/* RESET */
function resetAll() {
    document.getElementById('noteText').textContent = '';
    document.getElementById('noteStatus').textContent = '';
    closePreview();
}


/* PREVENT ACCIDENTAL ZOOM */
document.addEventListener('gesturestart', function(e) {
    e.preventDefault();
});

document.addEventListener('dblclick', function(e) {
    e.preventDefault();
}, { passive: false });

</script>

</body>
</html>
