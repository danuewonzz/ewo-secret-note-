
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>EWO | Private Space</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #000;
  color: white;
  font-family: 'Montserrat', sans-serif;
  min-height: 100vh;
}

/* LOGIN PAGE */

#loginPage {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px;
  background: #000;
}

.login-box {
  width: 100%;
  max-width: 350px;
  text-align: center;
}

.logo {
  color: #d6b86a;
  font-size: 42px;
  font-weight: 700;
  letter-spacing: 12px;
  margin-bottom: 12px;
}

.subtitle {
  font-size: 9px;
  letter-spacing: 5px;
  color: #777;
  margin-bottom: 60px;
}

h2 {
  font-size: 21px;
  font-weight: 400;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

.description {
  font-size: 11px;
  color: #777;
  margin-bottom: 30px;
}

.password-wrap {
  position: relative;
}

input {
  width: 100%;
  height: 53px;
  background: #080808;
  border: 1px solid #292929;
  border-radius: 5px;
  color: white;
  outline: none;
  padding: 0 65px 0 18px;
  font-size: 14px;
  letter-spacing: 3px;
}

input:focus {
  border-color: #c9a84c;
  box-shadow: 0 0 15px #c9a84c22;
}

input::placeholder {
  color: #555;
  font-size: 11px;
}

.toggle {
  position: absolute;
  right: 16px;
  top: 19px;
  color: #aaa;
  font-size: 10px;
  cursor: pointer;
}

.login-btn {
  width: 100%;
  height: 50px;
  margin-top: 18px;
  background: #c9a84c;
  border: 1px solid #c9a84c;
  color: #000;
  border-radius: 5px;
  font-weight: 700;
  letter-spacing: 4px;
  cursor: pointer;
}

.login-btn:active {
  background: transparent;
  color: #d6b86a;
}

#error {
  min-height: 18px;
  color: #ff5555;
  font-size: 11px;
  margin-top: 16px;
}

.footer {
  color: #444;
  font-size: 9px;
  letter-spacing: 2px;
  margin-top: 60px;
}

/* HOME PAGE */

#homePage {
  display: none;
  min-height: 100vh;
  background: #000;
}

header {
  height: 75px;
  padding: 0 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: #050505;
  position: relative;
  z-index: 5;
}

.top-logo {
  color: #d6b86a;
  font-size: 24px;
  font-weight: 700;
  letter-spacing: 5px;
}

.logout {
  padding: 10px 17px;
  background: transparent;
  border: 1px solid #555;
  color: #aaa;
  font-size: 9px;
  letter-spacing: 2px;
  cursor: pointer;
}

/* SECOND PAGE BACKGROUND IMAGE */

.scene {
  height: calc(100vh - 75px);
  min-height: 550px;
  position: relative;
  overflow: hidden;

  background-image:
    linear-gradient(
      to bottom,
      rgba(0,0,0,0.05),
      rgba(0,0,0,0.05) 55%,
      rgba(0,0,0,0.50)
    ),
    url(file_000000003d188212a637e33ebda69a68.webp);

  background-size: cover;
  background-position: center center;
  background-repeat: no-repeat;
}

/* WELCOME TEXT */

.welcome {
  position: absolute;
  z-index: 3;
  text-align: center;
  bottom: 9%;
  width: 100%;
  padding: 10px;
  text-shadow: 0 2px 12px #000;
}

.welcome h1 {
  font-size: clamp(22px, 6vw, 42px);
  font-weight: 300;
  letter-spacing: 7px;
}

.welcome p {
  margin-top: 15px;
  color: #ccc;
  font-size: 9px;
  letter-spacing: 4px;
}

/* LOVE QUOTE NOTIFICATION */

#quoteNotification {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translate(-50%, -150%);
  width: calc(100% - 36px);
  max-width: 390px;
  padding: 23px 20px;
  background: #101010;
  border: 1px solid #c9a84c;
  border-radius: 9px;
  box-shadow: 0 10px 40px #000b;
  z-index: 100;
  text-align: center;
  opacity: 0;
  transition: transform .6s ease, opacity .6s ease;
}

#quoteNotification.show {
  transform: translate(-50%, 0);
  opacity: 1;
}

.notification-title {
  color: #d6b86a;
  font-size: 10px;
  letter-spacing: 3px;
  margin-bottom: 15px;
}

.notification-quote {
  color: #eee;
  font-size: 12px;
  line-height: 1.9;
  font-weight: 300;
}

.notification-close {
  margin-top: 18px;
  padding: 9px 22px;
  background: transparent;
  border: 1px solid #c9a84c;
  color: #d6b86a;
  font-size: 9px;
  letter-spacing: 2px;
  cursor: pointer;
  border-radius: 3px;
}

@media(max-width:480px) {
  .welcome h1 {
    letter-spacing: 5px;
  }

  .scene {
    background-position: center center;
  }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->

<section id="loginPage">

  <div class="login-box">

    <div class="logo">EWO</div>

    <div class="subtitle">PRIVATE SPACE</div>

    <h2>Welcome Back</h2>

    <p class="description">
      Enter your password to continue
    </p>

    <form id="loginForm">

      <div class="password-wrap">

        <input
          type="password"
          id="password"
          placeholder="Enter Password"
          autocomplete="current-password"
          required
        >

        <span class="toggle" id="toggle">
          SHOW
        </span>

      </div>

      <button class="login-btn" type="submit">
        UNLOCK
      </button>

      <div id="error"></div>

    </form>

    <div class="footer">
      DANU EWONZ • 2026
    </div>

  </div>

</section>


<!-- HOME PAGE -->

<section id="homePage">

  <header>

    <div class="top-logo">EWO.</div>

    <button class="logout" id="logout">
      LOG OUT
    </button>

  </header>

  <div class="scene">

    <div class="welcome">

      <h1>WELCOME TO EWO</h1>

      <p>YOUR OWN PRIVATE WORLD</p>

    </div>

  </div>

</section>


<!-- LOVE QUOTE NOTIFICATION -->

<div id="quoteNotification" role="status" aria-live="polite">

  <div class="notification-title">
    A PRIVATE MESSAGE 🥀
  </div>

  <p class="notification-quote">
    "Even if I die, I will always love that heart with all mine.
    When I'm no longer around, please keep living happily. 🥀"
  </p>

  <button class="notification-close" id="closeNotification">
    CLOSE
  </button>

</div>


<script>

const PASSWORD = "19971128";

const loginPage = document.getElementById("loginPage");
const homePage = document.getElementById("homePage");
const password = document.getElementById("password");
const error = document.getElementById("error");

const notification =
document.getElementById("quoteNotification");


// LOGIN AND AUTO UNLOCK

document.getElementById("loginForm")
.addEventListener("submit", function(e) {

  e.preventDefault();

  if (password.value === PASSWORD) {

    loginPage.style.display = "none";
    homePage.style.display = "block";

    password.value = "";
    error.textContent = "";

    setTimeout(function() {
      notification.classList.add("show");
    }, 500);

  } else {

    error.textContent = "Incorrect password. Try again.";
    password.value = "";

  }

});


// SHOW / HIDE PASSWORD

document.getElementById("toggle")
.addEventListener("click", function() {

  if (password.type === "password") {

    password.type = "text";
    this.textContent = "HIDE";

  } else {

    password.type = "password";
    this.textContent = "SHOW";

  }

});


// CLOSE NOTIFICATION

document.getElementById("closeNotification")
.addEventListener("click", function() {

  notification.classList.remove("show");

});


// LOG OUT

document.getElementById("logout")
.addEventListener("click", function() {

  notification.classList.remove("show");

  homePage.style.display = "none";
  loginPage.style.display = "flex";

});

</script>

</body>
</html>
