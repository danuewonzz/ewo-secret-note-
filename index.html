
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>EWO | Private Space</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: 'Montserrat', sans-serif;
    user-select: none;
}

:root {
    --gold: #d6ad45;
    --gold-light: #f5d77b;
}

.page {
    display: none;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    position: relative;
    overflow: hidden;
    background: #000;
}

.page.active {
    display: block;
}

/* NIGHT SKY BACKGROUND */
.scene {
    position: absolute;
    inset: 0;
    background:
        linear-gradient(rgba(0,0,0,.28), rgba(0,0,0,.65)),
        url("file_000000003d188212a637e33ebda69a68.webp");
    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;
}

/* LOGIN PAGE */
#loginPage {
    display: none;
    align-items: center;
    justify-content: center;
}

#loginPage.active {
    display: flex;
}

.login-box {
    position: relative;
    z-index: 2;
    width: 85%;
    max-width: 360px;
    padding: 38px 25px;
    text-align: center;
    border: 1px solid rgba(214,173,69,.55);
    border-radius: 18px;
    background: rgba(0,0,0,.70);
    box-shadow: 0 0 30px rgba(214,173,69,.10);
    backdrop-filter: blur(12px);
}

.logo {
    color: var(--gold-light);
    font-size: 48px;
    font-weight: 800;
    letter-spacing: 7px;
    margin-bottom: 8px;
}

.login-subtitle {
    color: #aaa;
    font-size: 10px;
    letter-spacing: 4px;
    margin-bottom: 35px;
}

.password-input {
    width: 100%;
    padding: 15px;
    border: 1px solid rgba(214,173,69,.55);
    border-radius: 8px;
    outline: none;
    color: white;
    background: rgba(255,255,255,.05);
    font-family: inherit;
    text-align: center;
    letter-spacing: 3px;
    font-size: 15px;
}

.password-input::placeholder {
    color: #888;
    letter-spacing: 2px;
}

.login-btn {
    width: 100%;
    margin-top: 18px;
    padding: 14px;
    border: 1px solid var(--gold);
    border-radius: 8px;
    color: #000;
    background: linear-gradient(135deg, #f5d77b, #b8860b);
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 3px;
    font-family: inherit;
    cursor: pointer;
}

.login-error {
    color: #ff5555;
    font-size: 11px;
    margin-top: 14px;
    min-height: 15px;
}

.footer {
    position: absolute;
    z-index: 2;
    bottom: 18px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,.55);
    font-size: 9px;
    letter-spacing: 2px;
}

/* SECOND PAGE */
#homePage {
    background: #000;
}

.topbar {
    position: absolute;
    z-index: 5;
    top: 0;
    left: 0;
    width: 100%;
    height: 65px;
    padding: 0 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0,0,0,.55);
    border-bottom: 1px solid rgba(214,173,69,.35);
    backdrop-filter: blur(8px);
}

.top-logo {
    color: var(--gold-light);
    font-size: 23px;
    font-weight: 800;
    letter-spacing: 4px;
}

.logout-btn, .back-btn {
    color: #ff5555;
    border: 1px solid rgba(255,75,75,.65);
    background: rgba(0,0,0,.45);
    border-radius: 6px;
    padding: 9px 13px;
    font-size: 10px;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: 1px;
    cursor: pointer;
}

.home-background {
    position: absolute;
    inset: 65px 0 0;
}

/* THIRD PAGE */
#notesPage {
    background: #000;
}

.notes-content {
    position: absolute;
    z-index: 2;
    top: 65px;
    bottom: 0;
    left: 0;
    right: 0;
    overflow-y: auto;
    padding: 25px 20px 35px;
    scrollbar-width: none;
}

.notes-content::-webkit-scrollbar {
    display: none;
}

/* WELCOME TEXT */
.welcome-section {
    text-align: center;
    padding: 28px 10px 25px;
    margin-bottom: 22px;
    border-bottom: 1px solid rgba(214,173,69,.35);
}

.welcome-title {
    color: var(--gold-light);
    font-size: 27px;
    font-weight: 800;
    letter-spacing: 3px;
    margin-bottom: 12px;
    text-shadow: 0 0 15px rgba(214,173,69,.25);
}

.welcome-subtitle {
    color: #ddd;
    font-size: 10px;
    letter-spacing: 3px;
}

/* MAIN BUTTONS */
.main-menu {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.main-btn {
    width: 100%;
    min-height: 65px;
    border: 1px solid rgba(214,173,69,.65);
    border-radius: 10px;
    background: rgba(15,15,15,.95);
    color: var(--gold-light);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    transition: .2s;
}

.main-btn:active {
    background: rgba(214,173,69,.15);
    transform: scale(.98);
}

/* SUB BUTTONS */
.note-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 15px;
}

.note-btn {
    width: 100%;
    min-height: 55px;
    border: 1px solid rgba(214,173,69,.55);
    border-radius: 10px;
    background: #0e0e0e;
    color: #f5d77b;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 2px;
    text-align: left;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
}

.note-btn:active {
    background: rgba(214,173,69,.15);
}

.note-arrow {
    color: #aaa;
    font-size: 18px;
}

/* NOTE VIEWER */
.note-viewer {
    display: none;
    margin-top: 20px;
    padding: 20px;
    min-height: 130px;
    border: 1px solid rgba(214,173,69,.55);
    border-radius: 10px;
    background: #0b0b0b;
}

.note-viewer.show {
    display: block;
}

.note-heading {
    color: var(--gold-light);
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

.note-text {
    color: #eee;
    font-size: 13px;
    line-height: 1.9;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    user-select: text;
}

/* IMAGE GALLERY */
.image-gallery {
    display: none;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    margin-top: 15px;
}

.image-gallery.show {
    display: grid;
}

.gallery-item {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border: 1px solid rgba(214,173,69,.65);
    border-radius: 10px;
    background: #111;
    cursor: pointer;
}

.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

.gallery-label {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    padding: 9px 5px;
    color: #f5d77b;
    background: rgba(0,0,0,.75);
    text-align: center;
    font-size: 10px;
    letter-spacing: 2px;
}

/* FULL SCREEN IMAGE PREVIEW */
.image-preview {
    display: none;
    position: fixed;
    z-index: 50;
    inset: 0;
    background: rgba(0,0,0,.97);
    align-items: center;
    justify-content: center;
    padding: 15px;
}

.image-preview.show {
    display: flex;
}

.image-preview img {
    max-width: 100%;
    max-height: 85%;
    object-fit: contain;
    border-radius: 5px;
}

.preview-close {
    position: absolute;
    top: 20px;
    right: 20px;
    width: 42px;
    height: 42px;
    border: 1px solid var(--gold);
    border-radius: 50%;
    color: var(--gold-light);
    background: #111;
    font-size: 22px;
    cursor: pointer;
}

/* NOTIFICATION */
.notification-overlay {
    display: none;
    position: fixed;
    z-index: 20;
    inset: 0;
    align-items: center;
    justify-content: center;
    padding: 25px;
    background: rgba(0,0,0,.82);
    backdrop-filter: blur(8px);
}

.notification-overlay.show {
    display: flex;
}

.notification-box {
    width: 100%;
    max-width: 390px;
    padding: 35px 24px 25px;
    text-align: center;
    border: 1px solid var(--gold);
    border-radius: 17px;
    background: linear-gradient(145deg, rgba(25,21,12,.98), rgba(0,0,0,.98));
    box-shadow: 0 0 35px rgba(214,173,69,.18);
    animation: popup .45s ease;
}

@keyframes popup {
    from {
        opacity: 0;
        transform: scale(.85);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}

.notification-label {
    color: var(--gold-light);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 4px;
    margin-bottom: 25px;
}

.notification-message {
    color: #f1e7d0;
    font-size: 15px;
    line-height: 2;
}

.notification-close {
    width: 100%;
    margin-top: 30px;
    padding: 14px;
    border: 1px solid var(--gold);
    border-radius: 8px;
    color: #000;
    background: linear-gradient(135deg, #f5d77b, #b8860b);
    font-family: inherit;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 3px;
    cursor: pointer;
}

@media (max-width: 360px) {
    .welcome-title {
        font-size: 23px;
    }

    .notification-message {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<!-- PAGE 1 : LOGIN -->
<section id="loginPage" class="page active">

    <div class="scene"></div>

    <div class="login-box">
        <div class="logo">EWO.</div>
        <div class="login-subtitle">PRIVATE SPACE</div>

        <input
            type="password"
            id="passwordInput"
            class="password-input"
            placeholder="ENTER PASSWORD"
            autocomplete="off"
        >

        <button class="login-btn" onclick="login()">
            UNLOCK SPACE
        </button>

        <div id="loginError" class="login-error"></div>
    </div>

    <div class="footer">DANU EWONZ • 2026</div>
</section>


<!-- PAGE 2 : HOME -->
<section id="homePage" class="page">

    <div class="scene home-background"></div>

    <header class="topbar">
        <div class="top-logo">EWO.</div>
        <button class="logout-btn" onclick="logout()">LOG OUT</button>
    </header>

</section>


<!-- PAGE 3 : PRIVATE SPACE -->
<section id="notesPage" class="page">

    <header class="topbar">
        <div class="top-logo">EWO.</div>
        <button class="back-btn" onclick="goBack()">← BACK</button>
    </header>

    <main class="notes-content">

        <div class="welcome-section">
            <div class="welcome-title">WELCOME TO EWO</div>
            <div class="welcome-subtitle">YOUR OWN PRIVATE WORLD</div>
        </div>

        <!-- MAIN BUTTONS -->
        <div class="main-menu" id="mainMenu">

            <button class="main-btn" onclick="toggleNotes()">
                NOTES
            </button>

            <button class="main-btn" onclick="toggleImages()">
                ♡ IMAGE
            </button>

        </div>

        <!-- NOTES 1 - 10 -->
        <div id="noteButtonsPage" style="display:none;">
            <div class="note-list" id="noteList"></div>
        </div>

        <!-- NOTE CONTENT -->
        <div class="note-viewer" id="noteViewer">
            <div class="note-heading" id="noteHeading"></div>
            <div class="note-text" id="noteText"></div>
        </div>

        <!-- IMAGE GALLERY -->
        <div class="image-gallery" id="imageGallery"></div>

        <div class="footer" style="position:relative; bottom:auto; margin-top:35px;">
            DANU EWONZ • 2026
        </div>

    </main>
</section>


<!-- PRIVATE MESSAGE NOTIFICATION -->
<div class="notification-overlay" id="quoteNotification">

    <div class="notification-box">

        <div class="notification-label">A PRIVATE MESSAGE</div>

        <div class="notification-message">
            Even if I die, I will always love that heart with all mine.
            When I'm no longer around, please keep living happily. 🥀
        </div>

        <button class="notification-close" onclick="closeNotification()">
            CONTINUE
        </button>

    </div>
</div>


<!-- FULL SCREEN IMAGE VIEW -->
<div class="image-preview" id="imagePreview">

    <button class="preview-close" onclick="closeImagePreview()">
        ×
    </button>

    <img id="previewImage" src="" alt="Private Image">

</div>


<script>
const PASSWORD = "19971128";

const loginPage = document.getElementById("loginPage");
const homePage = document.getElementById("homePage");
const notesPage = document.getElementById("notesPage");
const notification = document.getElementById("quoteNotification");

let notificationOpened = false;

/* PAGE CONTROL */
function showPage(page) {
    loginPage.classList.remove("active");
    homePage.classList.remove("active");
    notesPage.classList.remove("active");

    page.classList.add("active");
}

/* LOGIN */
function login() {

    const enteredPassword =
        document.getElementById("passwordInput").value;

    const error =
        document.getElementById("loginError");

    if (enteredPassword === PASSWORD) {

        error.textContent = "";
        document.getElementById("passwordInput").value = "";

        resetPrivateSpace();
        showPage(homePage);

        notificationOpened = true;

        setTimeout(() => {
            if (
                notificationOpened &&
                homePage.classList.contains("active")
            ) {
                notification.classList.add("show");
            }
        }, 500);

    } else {
        error.textContent = "Incorrect Password. Try Again.";
    }
}

/* ENTER KEY */
document.getElementById("passwordInput")
.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        login();
    }
});

/* CLOSE NOTIFICATION */
function closeNotification() {

    notification.classList.remove("show");
    notificationOpened = false;

    setTimeout(() => {
        showPage(notesPage);
    }, 350);
}

/* LOG OUT */
function logout() {

    notification.classList.remove("show");
    notificationOpened = false;

    resetPrivateSpace();
    showPage(loginPage);
}

/* BACK */
function goBack() {

    resetPrivateSpace();
    showPage(homePage);
}

/* RESET */
function resetPrivateSpace() {

    document.getElementById("noteButtonsPage").style.display = "none";

    document.getElementById("imageGallery").classList.remove("show");

    document.getElementById("noteViewer").classList.remove("show");

    closeImagePreview();
}

/* NOTES BUTTON */
function toggleNotes() {

    const notes = document.getElementById("noteButtonsPage");
    const gallery = document.getElementById("imageGallery");

    const opening = notes.style.display === "none";

    notes.style.display = opening ? "block" : "none";

    gallery.classList.remove("show");

    document.getElementById("noteViewer").classList.remove("show");
}

/* IMAGE BUTTON */
function toggleImages() {

    const gallery = document.getElementById("imageGallery");
    const notes = document.getElementById("noteButtonsPage");

    const opening = !gallery.classList.contains("show");

    gallery.classList.toggle("show", opening);

    notes.style.display = "none";

    document.getElementById("noteViewer").classList.remove("show");
}

/* CREATE NOTE BUTTONS */
const noteList = document.getElementById("noteList");

for (let i = 1; i <= 10; i++) {

    const button = document.createElement("button");

    button.className = "note-btn";

    button.innerHTML = `
        <span>NOTE ${i}</span>
        <span class="note-arrow">›</span>
    `;

    button.addEventListener("click", function() {
        openGitNote(i);
    });

    noteList.appendChild(button);
}

/* LOAD GITHUB NOTES */
async function openGitNote(number) {

    const viewer = document.getElementById("noteViewer");
    const heading = document.getElementById("noteHeading");
    const text = document.getElementById("noteText");

    viewer.classList.add("show");

    heading.textContent = "NOTE " + number;
    text.textContent = "Loading note...";

    const fileName = encodeURIComponent("Note " + number + ".txt");

    const noteURL = "NOTES/" + fileName + "?v=" + Date.now();

    try {

        const response = await fetch(noteURL, {
            cache: "no-store"
        });

        if (!response.ok) {
            throw new Error("File not found");
        }

        const content = await response.text();

        text.textContent = content.trim() || "This note is empty.";

    } catch (error) {

        text.textContent =
            "Unable to load this note.\n\n" +
            "Please check: NOTES/Note " + number + ".txt";
    }
}

/* CREATE IMAGE GALLERY */
const imageGallery = document.getElementById("imageGallery");

for (let i = 1; i <= 10; i++) {

    const item = document.createElement("div");

    item.className = "gallery-item";

    const image = document.createElement("img");

    image.src = "IMAGES/Image " + i + ".jpg";
    image.alt = "Image " + i;
    image.loading = "lazy";

    image.onerror = function() {
        item.style.display = "none";
    };

    const label = document.createElement("div");

    label.className = "gallery-label";
    label.textContent = "IMAGE " + i;

    item.appendChild(image);
    item.appendChild(label);

    item.addEventListener("click", function() {
        openImagePreview(image.src);
    });

    imageGallery.appendChild(item);
}

/* OPEN FULL SCREEN IMAGE */
function openImagePreview(imageSrc) {

    const preview = document.getElementById("imagePreview");
    const previewImage = document.getElementById("previewImage");

    previewImage.src = imageSrc;
    preview.classList.add("show");
}

/* CLOSE IMAGE */
function closeImagePreview() {

    const preview = document.getElementById("imagePreview");

    preview.classList.remove("show");
    document.getElementById("previewImage").src = "";
}

/* CLOSE PREVIEW BY BACKGROUND TAP */
document.getElementById("imagePreview")
.addEventListener("click", function(event) {

    if (event.target === this) {
        closeImagePreview();
    }

});

/* PREVENT DOUBLE TAP ZOOM */
document.addEventListener("dblclick", function(event) {
    event.preventDefault();
}, { passive: false });

document.addEventListener("gesturestart", function(event) {
    event.preventDefault();
});

</script>

</body>
</html>
